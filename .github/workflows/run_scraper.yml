name: Run Web Scraping Daily

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: ingestion
  cancel-in-progress: false

jobs:
  run_scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Download latest database artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: temp-db
          path: storage/

      - name: Run ingestion job
        env:
          TOKEN_NEWS: ${{ secrets.TOKEN_NEWS }}
          TOKEN_GOOGLEAI: ${{ secrets.TOKEN_GOOGLEAI }}
        run: |
          poetry run python -m src.ingestion --target all

      - name: Upload updated database
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: temp-db
          path: storage/temp_db.sqlite
          retention-days: 30
